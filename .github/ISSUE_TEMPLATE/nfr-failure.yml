# PLAN-L7-451 W5: NFR (非機能要件) 未達 episode の Issue Form (PLAN-L6-83 準拠)。
name: NFR failure
description: 性能・信頼性などの非機能要件未達 episode を起票する
title: "NFR: "
labels: ["ut-tdd", "nfr"]
body:
  - type: dropdown
    id: hierarchy_role
    attributes:
      label: Hierarchy role
      description: 既存の成果目標がある bounded slice は child を選び、起票後に正式な parent を設定する
      options:
        - child
        - top-level outcome
    validations:
      required: true
  - type: input
    id: parent_issue
    attributes:
      label: Parent Issue
      description: child の場合は #N。top-level の場合は N/A と理由を記載する
    validations:
      required: true
  - type: textarea
    id: closure_condition
    attributes:
      label: Closure condition
      description: この Issue 固有の受入証跡と、親へ返す完了条件
    validations:
      required: true
  - type: input
    id: nfr_id
    attributes:
      label: NFR / 要件 ID
    validations:
      required: true
  - type: textarea
    id: observed_state
    attributes:
      label: Observed state (実測値と目標値)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence path / digest (計測ログ等)
    validations:
      required: true
  - type: input
    id: reason_code
    attributes:
      label: Failure / drift reason code
    validations:
      required: true
  - type: input
    id: observed_head
    attributes:
      label: Observed HEAD (git SHA)
    validations:
      required: true
  - type: dropdown
    id: drive_model
    attributes:
      label: Drive model
      options:
        - recovery
        - reverse
        - redesign
    validations:
      required: true
  - type: input
    id: reentry_target
    attributes:
      label: Reentry target (Forward 再合流先 PLAN / layer)
    validations:
      required: true
