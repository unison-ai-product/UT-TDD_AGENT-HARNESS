# PLAN-L7-451 W5: Incident episode の Issue Form (PLAN-L6-83 準拠)。
name: Incident
description: 運用中の障害・退行 episode を起票する
title: "Incident: "
labels: ["ut-tdd", "drive:incident", "risk:p1"]
body:
  - type: dropdown
    id: hierarchy_role
    attributes:
      label: Hierarchy role
      description: 既存の成果目標がある bounded slice は child を選び、起票後に正式な parent を設定する
      options:
        - child
        - top-level outcome
    validations:
      required: true
  - type: input
    id: parent_issue
    attributes:
      label: Parent Issue
      description: child の場合は #N。top-level の場合は N/A と理由を記載する
    validations:
      required: true
  - type: textarea
    id: closure_condition
    attributes:
      label: Closure condition
      description: この Issue 固有の受入証跡と、親へ返す完了条件
    validations:
      required: true
  - type: textarea
    id: observed_state
    attributes:
      label: Observed state (障害の観測事実・影響範囲)
    validations:
      required: true
  - type: input
    id: observed_head
    attributes:
      label: Observed HEAD (git SHA)
    validations:
      required: true
  - type: input
    id: origin_plan
    attributes:
      label: Origin PLAN ID (関連する場合)
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence path / digest
    validations:
      required: true
  - type: input
    id: reason_code
    attributes:
      label: Failure / drift reason code
    validations:
      required: true
  - type: dropdown
    id: drive_model
    attributes:
      label: Drive model
      options:
        - incident
        - recovery
    validations:
      required: true
  - type: input
    id: reentry_target
    attributes:
      label: Reentry target (Forward 再合流先 PLAN / layer)
    validations:
      required: true
