# PLAN-L7-451 W5: Reverse (backfill) episode の Issue Form (PLAN-L6-83 準拠)。
name: Reverse
description: 実装観測から設計へ gap-only backfill する Reverse episode を起票する
title: "Reverse: "
labels: ["ut-tdd", "drive:reverse"]
body:
  - type: input
    id: origin_plan
    attributes:
      label: Origin PLAN ID
      placeholder: PLAN-L7-xxx
    validations:
      required: true
  - type: textarea
    id: observed_state
    attributes:
      label: Observed state (実装事実と設計の差分)
    validations:
      required: true
  - type: input
    id: observed_head
    attributes:
      label: Observed HEAD (git SHA)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence path / digest
    validations:
      required: true
  - type: input
    id: reason_code
    attributes:
      label: Failure / drift reason code
    validations:
      required: true
  - type: dropdown
    id: drive_model
    attributes:
      label: Drive model
      options:
        - reverse
    validations:
      required: true
  - type: input
    id: reentry_target
    attributes:
      label: Reentry target (Forward 再合流先 PLAN / layer)
    validations:
      required: true
