# 依存の更新 PR を自動で作る (#766 の「依存の更新」、#791、#1247)。
# 自動 PR も通常の PR と同じ CI・非著者 review・ut-tdd pr merge を通す。
# PR が積み上がって WIP を詰まらせないよう、件数の上限を小さくする。
# ゼロトラストダウンロード原則 (CLAUDE.md、#1741): 公開から 14 日たつまで更新 PR を作らない (cooldown)。
# major の更新は破壊的なので Dependabot の対象から外し、計画して手で上げる。
# @biomejs/biome と esbuild は src/lint/toolchain-pin.ts が版を固定しているので対象から外す。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@biomejs/biome"
      - dependency-name: esbuild
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
