# harness-check — UT-TDD Agent Harness CI (要件定義書 §6.2/§6.9)
#
# §6.9: ローカル hook は早期検知のみ。全量テスト・回帰確認は GitHub Actions で実行する。
# §6.2: Branch Protection の Required Status Checks は本 `harness-check` 1 本のみ (集約 gate)。
#
# 本 workflow の aggregate `harness-check` は現行 main protection の唯一の Required Status Check。
# `harness-check-linux` / `harness-check-windows` は component CI evidence であり、将来の D2 は
# D1 candidate と trusted custody の最終 AND をこの aggregate 出力へ一方向に投影する。
# トリガは §7.5-7.6 の「全 PR 共通 aggregate harness-check」契約に従い pull_request を base 限定しない
# (stacked PR (base≠main) を除外しない — issue #57 / PLAN-L6-82)。solo main 直開発の即 dogfood 用に `push: [main]` を維持する。
#
# 現状実装される subjob = branch-type guard + typecheck + db rebuild + 全回帰 (vitest) + biome lint + audit quality + doctor。
# この source workflow の `npm run test` / raw vitest 全量回帰は source-only governance docs を前提にする。
# clean Pack workflow は `docs/templates/github/common/pack-harness-check.yml` の Pack smoke test と setup-smoke doctor を使う。
#
# PLAN-L7-455 (troubleshoot, issue #109) Phase 1: `classify` step (git diff ベース、
# src/github/change-lane.ts) が doc-only 変更を検出したときだけ重い step
# (typecheck / db rebuild / 全回帰 vitest / audit quality / full doctor) を skip する。
# doc-safe allowlist (SSoT: src/github/change-lane.ts DOC_LANE_PREFIXES):
#   docs/archive/**.md, docs/migration/**.md, docs/reference/**.md, docs/research/**.md
# 上記 4 tree (非正本の参照 prose) の *.md のみ。正本設計・governance・PLAN
# (docs/plans/**)・runtime 規則 (root および .claude/ の *.md)・共有 memory
# (.ut-tdd/memory/**) はすべて full へ fail-close する (blind review FLAG 是正、
# 2026-07-21)。判定不能・新種 path・diff range 解決不能も常に "full"。
# この allowlist 記述はコメントと実装の drift を防ぐため
# tests/change-lane.test.ts が本 header を parse して DOC_LANE_PREFIXES と
# 集合一致を検査する (2026-07-28: 旧コメントが実装より広い allowlist を記述し、
# orchestrator の lane 誤予測を招いた実害への countermeasure)。
# biome lint と branch-type guard は lane に依らず常に実行する。doc lane では代わりに
# plan lint / readability / rule-drift のみを実行する (doc-lane checks step)。
# 集約 job (`harness-check`) は変更種別に依らず常に生成され (`if: always()`)、skip 可能な
# step の allowlist は `src/lint/github-ci-policy.ts` の `checkLaneSkipSafety` が fail-close 検査する
# (PLAN-RECOVERY-15 の aggregate 契約は不変)。
name: harness-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: harness-check-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  harness-check-linux:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node (harness 実行系の正式 runtime、PLAN-L7-462 step 2)
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm

      - name: install deps (frozen)
        run: npm ci --no-audit --no-fund

      # PLAN-L7-455: 変更ファイル分類 (doc-only lane 判定、fail-close)。判定不能・新種 path は
      # 必ず "full" になる。ロジック本体は src/github/change-lane.ts (unit test 済み)。
      - name: classify changed files (doc lane vs full, fail-close)
        id: classify
        run: |
          node src/cli.ts github classify-changes \
            --event-name "${{ github.event_name }}" \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --before-sha "${{ github.event.before }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: branch-type guard (commitlint / poc / hotfix)
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          printf '%s\n' "$PR_BODY" > .ut-tdd-pr-body.txt
          git log --format=%s -n 20 > .ut-tdd-commit-subjects.txt
          node src/cli.ts github guard \
            --head-ref "$HEAD_REF" \
            --base-ref "$BASE_REF" \
            --pr-title "$PR_TITLE" \
            --pr-body-file .ut-tdd-pr-body.txt \
            --commit-file .ut-tdd-commit-subjects.txt

      - name: typecheck (tsc --noEmit)
        if: ${{ steps.classify.outputs.lane == 'full' }}
        run: npm run typecheck

      - name: db rebuild (deterministic projection)
        if: ${{ steps.classify.outputs.lane == 'full' }}
        run: node src/cli.ts db rebuild --json

      - name: doctor (governance hard gates)
        # PLAN-L7-420 Step 2: green-command-digest は L7-132/L7-194/L7-303 で opt-in strict として
        # 設計されたが、CI がこのフラグ無しで doctor を回していたため strict gate がどの自動経路でも
        # 走っていなかった (G-1)。PLAN-L7-420 Step 1 で不一致 49 件 (30 PLAN) を rerun-bound correction
        # で是正し尽くしたことを前提に、ここで CI へ hard 投入する。
        # telemetry-provenance (L7-192) は現状 runtime capture gap が残るため、投入は期限付き deferral
        # (PLAN-L7-420 §telemetry-provenance strict deferral 参照)。
        # PLAN-L7-455 lane 判定 (doc-only lane では skip) と PLAN-L7-420 strict flag を両立させる。
        if: ${{ steps.classify.outputs.lane == 'full' }}
        # PLAN-L7-461: 実測結果を envelope として書き出し、同一 job の vitest fence が
        # doctor を二重実行せず消費できるようにする。消費は宣言済み portable surface
        # (HEAD / producer root / ref map / options / check ID 集合 / producer identity)
        # の完全一致時のみ。gitignored state や process 環境の同値性は主張しない。
        # そのため本 step は test step より前に置く。
        env:
          UT_TDD_DOCTOR_RESULT_FILE: ${{ runner.temp }}/ut-tdd-doctor-result.json
        run: >-
          node src/cli.ts doctor --strict-green-command-digest
          --result-file "$UT_TDD_DOCTOR_RESULT_FILE"

      - name: test — 全回帰 (vitest run)
        if: ${{ steps.classify.outputs.lane == 'full' }}
        # PLAN-L7-461: fence は上の doctor step の envelope を消費する。宣言した surface
        # (root / strict flag) と一致しなければ従来どおり自走する (fail-close)。
        env:
          UT_TDD_DOCTOR_RESULT_FILE: ${{ runner.temp }}/ut-tdd-doctor-result.json
          UT_TDD_DOCTOR_RESULT_ROOT: ${{ github.workspace }}
          UT_TDD_DOCTOR_RESULT_STRICT: "1"
        run: npm run test

      # doc lane では全回帰の代わりに doc 系 check (plan lint / readability / rule-drift) のみ実行する。
      - name: doc lane checks (plan lint / readability / rule-drift)
        if: ${{ steps.classify.outputs.lane == 'doc' }}
        run: |
          node src/cli.ts plan lint
          npm run test:doc-lane

      - name: doc lane source doctor
        if: ${{ steps.classify.outputs.lane == 'doc' }}
        run: node src/cli.ts doctor --profile source-doc-lane

      - name: lint (biome)
        run: npm run lint

      - name: audit quality (gate findings)
        if: ${{ steps.classify.outputs.lane == 'full' }}
        run: node src/cli.ts audit quality --include-tests --limit 20

      # PLAN-L7-451 W3: 人間向け projection。判定正本は上の gate 実測であり、
      # summary 生成は常に exit 0 (失敗で CI を red にしない)。
      - name: job summary (UT-TDD projection)
        if: ${{ always() }}
        run: node src/cli.ts github summary >> "$GITHUB_STEP_SUMMARY"

  # PLAN-L7-448 (issue #81): Windows first-class 方針 (.claude/CLAUDE.md Guard Rules) に対する
  # CI 被覆。ubuntu leg では構造的に検証不能な Windows 固有経路 (path separator / SQLite handle
  # 解放遅延 / reference seal) を最小構成で被覆する。full doctor はローカル 10 分超 (issue #70) の
  # ため toolchain scope に絞る。ここで顕在化した Windows 固有 Red の修正は個別 PLAN / debt route
  # へ分離する (PLAN-L7-448 スコープ 2)。
  harness-check-windows:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node (harness 実行系の正式 runtime、PLAN-L7-462 step 2)
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm

      - name: install deps (frozen)
        run: npm ci --no-audit --no-fund

      # PLAN-L7-455: Linux leg と同じ分類判定を独立実行する (job 間で output を共有しないため)。
      # windows-latest の既定 shell (pwsh) では動かないため bash を明示する。
      - name: classify changed files (doc lane vs full, fail-close)
        id: classify
        shell: bash
        run: |
          node src/cli.ts github classify-changes \
            --event-name "${{ github.event_name }}" \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --before-sha "${{ github.event.before }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: typecheck (tsc --noEmit)
        if: ${{ steps.classify.outputs.lane == 'full' }}
        run: npm run typecheck

      - name: db rebuild (deterministic projection on Windows SQLite)
        if: ${{ steps.classify.outputs.lane == 'full' }}
        run: node src/cli.ts db rebuild --json

      - name: test — Windows full 回帰 (vitest run, windows leg)
        if: ${{ steps.classify.outputs.lane == 'full' }}
        run: npm run test:windows

      - name: doc lane source checks
        if: ${{ steps.classify.outputs.lane == 'doc' }}
        run: node src/cli.ts doctor --profile source-doc-lane

      - name: doctor (toolchain scope)
        if: ${{ steps.classify.outputs.lane == 'full' }}
        run: node src/cli.ts doctor --scope toolchain

  # Issue #485 F0c: F0b's existing sealed Node generation producer is executed
  # on both supported OSes. These jobs are separate from the harness legs so a
  # harness-only success cannot masquerade as Node generation evidence.
  node-generation-linux:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node (sealed generation runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm

      - name: install deps (frozen)
        run: npm ci --no-audit --no-fund

      - name: build and verify sealed Node generation (linux)
        env:
          NODE_GENERATION_LANE: linux
          NODE_GENERATION_EVIDENCE_FILE: ${{ runner.temp }}/node-generation-evidence.json
        run: node scripts/node-generation-ci.mjs

      - name: upload sealed Node generation evidence (node-generation-linux)
        uses: actions/upload-artifact@v4
        with:
          name: node-generation-linux
          path: |-
            ${{ runner.temp }}/node-generation-evidence.json
            dist/node-generations
          if-no-files-found: error

  node-generation-windows:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node (sealed generation runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm

      - name: install deps (frozen)
        run: npm ci --no-audit --no-fund

      - name: build and verify sealed Node generation (windows)
        env:
          NODE_GENERATION_LANE: windows
          NODE_GENERATION_EVIDENCE_FILE: ${{ runner.temp }}/node-generation-evidence.json
        run: node scripts/node-generation-ci.mjs

      - name: upload sealed Node generation evidence (node-generation-windows)
        uses: actions/upload-artifact@v4
        with:
          name: node-generation-windows
          path: |-
            ${{ runner.temp }}/node-generation-evidence.json
            dist/node-generations
          if-no-files-found: error

  # PLAN-RECOVERY-15 / issue #97: Branch Protection が参照する唯一の Required
  # Status Check。片脚が failure / cancelled / skipped の場合も必ず起動して Red にする。
  # doc lane で個別 step が skip されても、この aggregate job 自体は変更種別に依らず常に
  # 生成される (PLAN-L7-455 の必須制約)。
  harness-check:
    needs: [harness-check-linux, harness-check-windows, node-generation-linux, node-generation-windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node (aggregate admission runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"

      - name: download Node generation evidence
        uses: actions/download-artifact@v4
        with:
          pattern: node-generation-*
          path: node-generation-evidence

      - name: require harness and Node generation success
        run: test "${{ needs.harness-check-linux.result }}" = "success" && test "${{ needs.harness-check-windows.result }}" = "success" && test "${{ needs.node-generation-linux.result }}" = "success" && test "${{ needs.node-generation-windows.result }}" = "success"

      - name: admit exact Node generation run
        run: node scripts/node-generation-ci-aggregate.mjs
        env:
          NODE_GENERATION_EVIDENCE_DIR: node-generation-evidence
