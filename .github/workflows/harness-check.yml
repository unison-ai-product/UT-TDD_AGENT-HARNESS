# harness-check — UT-TDD Agent Harness CI (要件定義書 §6.2/§6.9)
#
# §6.9: ローカル hook は早期検知のみ。全量テスト・回帰確認は GitHub Actions で実行する。
# §6.2: Branch Protection の Required Status Checks は本 `harness-check` 1 本のみ (集約 gate)。
#
# 本 workflow は §6.5 Phase 0-A 相当 (配備するが Required 化はしない / solo)。
# トリガは §7.5-7.6 の「全 PR 共通 aggregate harness-check」契約に従い pull_request を base 限定しない
# (stacked PR (base≠main) を除外しない — issue #57 / PLAN-L6-82)。solo main 直開発の即 dogfood 用に `push: [main]` を維持する。
#
# 現状実装される subjob = branch-type guard + typecheck + db rebuild + 全回帰 (vitest) + biome lint + audit quality + doctor。
# この source workflow の `bun run test` / raw vitest 全量回帰は source-only governance docs を前提にする。
# clean Pack workflow は `docs/templates/github/common/pack-harness-check.yml` の Pack smoke test と setup-smoke doctor を使う。
name: harness-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: harness-check-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # F0: 現行 Bun runtime を切り替えず、後続 slice が消費する sealed Node build
  # image だけを Linux / Windows の clean lock graph から検証する。
  node-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup reviewed Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: require reviewed npm
        shell: bash
        run: test "$(npm --version)" = "11.6.2"

      - name: install Node bootstrap graph
        run: npm ci --ignore-scripts

      - name: build sealed compiled CLI
        run: npm run build:node

      - name: prepare detached HEAD test fence
        run: node scripts/prepare-node-bootstrap-test-fence.mjs

      - name: verify build image contract
        run: node node_modules/vitest/vitest.mjs run tests/node-bootstrap-build-image.test.ts --reporter=dot

      - name: compiled CLI smoke
        run: node dist/ut-tdd.mjs status --json

  harness-check-linux:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: install deps (frozen)
        run: bun install --frozen-lockfile

      - name: branch-type guard (commitlint / poc / hotfix)
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          printf '%s\n' "$PR_BODY" > .ut-tdd-pr-body.txt
          git log --format=%s -n 20 > .ut-tdd-commit-subjects.txt
          bun src/cli.ts github guard \
            --head-ref "$HEAD_REF" \
            --base-ref "$BASE_REF" \
            --pr-title "$PR_TITLE" \
            --pr-body-file .ut-tdd-pr-body.txt \
            --commit-file .ut-tdd-commit-subjects.txt

      - name: typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: db rebuild (deterministic projection)
        run: bun src/cli.ts db rebuild --json

      - name: test — 全回帰 (vitest run)
        run: bun run test

      - name: lint (biome)
        run: bun run lint

      - name: audit quality (gate findings)
        run: bun src/cli.ts audit quality --include-tests --limit 20

      - name: doctor (governance hard gates)
        run: bun src/cli.ts doctor

      # PLAN-L7-451 W3: 人間向け projection。判定正本は上の gate 実測であり、
      # summary 生成は常に exit 0 (失敗で CI を red にしない)。
      - name: job summary (UT-TDD projection)
        if: ${{ always() }}
        run: bun src/cli.ts github summary >> "$GITHUB_STEP_SUMMARY"

  # PLAN-L7-448 (issue #81): Windows first-class 方針 (.claude/CLAUDE.md Guard Rules) に対する
  # CI 被覆。ubuntu leg では構造的に検証不能な Windows 固有経路 (path separator / SQLite handle
  # 解放遅延 / reference seal) を最小構成で被覆する。full doctor はローカル 10 分超 (issue #70) の
  # ため toolchain scope に絞る。ここで顕在化した Windows 固有 Red の修正は個別 PLAN / debt route
  # へ分離する (PLAN-L7-448 スコープ 2)。
  harness-check-windows:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: install deps (frozen)
        run: bun install --frozen-lockfile

      - name: typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: db rebuild (deterministic projection on Windows SQLite)
        run: bun src/cli.ts db rebuild --json

      - name: test — scoped 回帰 (vitest run, windows leg)
        run: bun run test:fast

      - name: doctor (toolchain scope)
        run: bun src/cli.ts doctor --scope toolchain

  # PLAN-RECOVERY-15 / issue #97: Branch Protection が参照する唯一の Required
  # Status Check。片脚が failure / cancelled / skipped の場合も必ず起動して Red にする。
  harness-check:
    needs: [node-bootstrap, harness-check-linux, harness-check-windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: require Node bootstrap, Linux, and Windows success
        run: test "${{ needs.node-bootstrap.result }}" = "success" && test "${{ needs.harness-check-linux.result }}" = "success" && test "${{ needs.harness-check-windows.result }}" = "success"
