name: pack-repro

# 使い捨ての受入証跡 (canary.8、#1879「別マシンでの実測の方式」)。
# 新しい Windows / Linux runner で docs/reference/pack-release-runbook.md を手順どおりに再現する。
# 作業 root (source / Pack / 出力) は OS ごとに home の外へ置く (Windows は C:/w、Linux は /tmp/w)。
# repro/pack-* への push だけで動く。main と PR では動かさない。push はしない (C1 / C2 / tag はすべて local)。

on:
  push:
    branches: ["repro/pack-*"]

permissions:
  contents: read

env:
  PACK_REPO_URL: https://github.com/unison-ai-product/UT-TDD_AGENT-HARNESS-Pack
  PACK_REF: main
  # 受入の対象の tag。Pack の公開済みの同名 tag があっても、clone は --no-tags なので local の tag を作れる。
  PACK_TAG: v0.2.0-canary.8

jobs:
  pack-repro:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # work_root は home の外。Linux は runner.temp も home の下なので /tmp を使う。
          - os: windows-latest
            work_root: C:/w
          - os: ubuntu-latest
            work_root: /tmp/w
    env:
      MATRIX_OS: ${{ matrix.os }}
      WORK_ROOT: ${{ matrix.work_root }}
      PACK_DIR: ${{ matrix.work_root }}/pack
      OUT_DIR: ${{ matrix.work_root }}/out
      EVIDENCE_DIR: ${{ matrix.work_root }}/evidence
    defaults:
      run:
        shell: bash
    steps:
      # runbook §1 / §2: source の commit を push された SHA に固定する。
      # Windows の workspace (D:\a\...) は home の外。Linux の workspace は home の下なので、次の step で /tmp/w/source へ写す。
      - name: checkout source at the pushed SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: prepare source outside home
        run: |
          set -eu
          mkdir -p "$WORK_ROOT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            src="$GITHUB_WORKSPACE"
          else
            src="$WORK_ROOT/source"
            git clone --no-hardlinks "$GITHUB_WORKSPACE" "$src"
            git -C "$src" checkout --detach "$GITHUB_SHA"
          fi
          echo "SRC_DIR=$src" >> "$GITHUB_ENV"

      # runbook §0: Node 24 は .node-version に固定する。
      - name: setup node from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: verify source, node and npm are outside home
        run: |
          set -eu
          cd "$SRC_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            sep='\'
            norm() { printf '%s' "$(cygpath -w "$1")" | tr 'A-Z' 'a-z' | tr '/' '\\'; }
          else
            sep='/'
            norm() { readlink -f "$1"; }
          fi
          home_w="$(norm "$HOME")"
          echo "HOME=$HOME ($home_w)"
          echo "--- which -a node npm"
          which -a node npm
          check_outside() {
            p="$(norm "$1")"
            case "$p" in
              "$home_w"|"$home_w$sep"*) echo "NG: $1 is under home" >&2; exit 1 ;;
            esac
            echo "ok (outside home): $1"
          }
          check_outside "$SRC_DIR"
          check_outside "$WORK_ROOT"
          check_outside "$(command -v node)"
          check_outside "$(command -v npm)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
          node -v
          npm -v
          test "$(node -v)" = "v$(tr -d '\r\n' < .node-version)"

      - name: npm ci --ignore-scripts (runbook §1.2)
        run: |
          set -eu
          cd "$SRC_DIR"
          npm ci --ignore-scripts

      - name: clone the public Pack repo (runbook §1.1, §1.3)
        run: |
          set -eu
          mkdir -p "$WORK_ROOT"
          git clone --no-tags -c core.autocrlf=false "$PACK_REPO_URL" "$PACK_DIR"
          git -C "$PACK_DIR" checkout --detach "$PACK_REF"
          git -C "$PACK_DIR" switch -c repro/c1
          test -z "$(git -C "$PACK_DIR" status --short)"
          git -C "$PACK_DIR" rev-parse HEAD

      # runbook §0.1: 中身は出さない。サイズだけ確かめる。set -x は使わない。
      - name: write the private denylist
        env:
          PACK_PRIVACY_DENYLIST: ${{ secrets.PACK_PRIVACY_DENYLIST }}
        run: |
          set -eu
          test -n "$PACK_PRIVACY_DENYLIST"
          mkdir -p "$HOME/.ut-tdd"
          printf '%s\n' "$PACK_PRIVACY_DENYLIST" > "$HOME/.ut-tdd/privacy-denylist.txt"
          test -s "$HOME/.ut-tdd/privacy-denylist.txt"
          echo "denylist written (content not shown)"

      # runbook §3: sync-pack。
      - name: sync-pack (runbook §3)
        run: |
          set -eu
          cd "$SRC_DIR"
          node src/cli.ts distribution sync-pack --repo-dir "$PACK_DIR" --tag "$PACK_TAG" --prune-local --json > "$RUNNER_TEMP/sync-pack.json"
          node -e '
            const o = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(JSON.stringify({ ok: o.ok, copiedArtifacts: o.pack && o.pack.copiedArtifacts }));
            if (o.ok !== true) process.exit(1);
          ' "$RUNNER_TEMP/sync-pack.json"

      # runbook §3 [未自動 #1882]: ビルド入力を、固定した SHA の tracked file から bytes を変えずに copy する。
      - name: copy build inputs by hand (runbook §3, 未自動 #1882)
        run: |
          set -eu
          cd "$SRC_DIR"
          git ls-tree -r --name-only "$GITHUB_SHA" \
            | grep -E '^(docs/governance/node-toolchain-provenance\.json|tsconfig\.node\.json|docs/governance/vmodel-document-catalog\.md|docs/templates/vmodel/[^/]+\.md)$' \
            | sort > "$RUNNER_TEMP/build-inputs.txt"
          expected="$(wc -l < "$RUNNER_TEMP/build-inputs.txt" | tr -d ' ')"
          echo "build inputs (ls-tree): $expected"
          test "$expected" -gt 3
          while IFS= read -r f; do
            mkdir -p "$PACK_DIR/$(dirname "$f")"
            git show "$GITHUB_SHA:$f" > "$PACK_DIR/$f"
          done < "$RUNNER_TEMP/build-inputs.txt"
          copied=0
          while IFS= read -r f; do
            cmp "$f" "$PACK_DIR/$f"
            copied=$((copied + 1))
          done < "$RUNNER_TEMP/build-inputs.txt"
          test "$copied" -eq "$expected"
          echo "copied and byte-compared: $copied"

      - name: privacy-scan the Pack checkout (runbook §3, 未自動 #1882)
        run: |
          set -eu
          cd "$PACK_DIR"
          node "$SRC_DIR/src/cli.ts" privacy-scan check --mode tree --fail-close

      # runbook §4.1: C1。sync-pack の nextCommands のうち git add だけを実行する。commit と push の行は実行しない。
      - name: C1 commit, local only (runbook §3 exec bit, §4.1)
        run: |
          set -eu
          cd "$SRC_DIR"
          node -e '
            const o = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            for (const c of o.pack.nextCommands) if (/^git -C \S+ add /.test(c)) console.log(c);
          ' "$RUNNER_TEMP/sync-pack.json" > "$RUNNER_TEMP/git-add.sh"
          test -s "$RUNNER_TEMP/git-add.sh"
          bash -eu "$RUNNER_TEMP/git-add.sh"
          tr -d '\r' < "$RUNNER_TEMP/build-inputs.txt" | xargs -d '\n' git -C "$PACK_DIR" add --
          # --prune-local が消した file (Pack に前からあって、今回の artifact 集合に無いもの) の削除を stage する。nextCommands は add だけを出すため。
          git -C "$PACK_DIR" add -u
          git -C "$PACK_DIR" update-index --chmod=+x -- scripts/ut-tdd scripts/git-hooks/pre-push
          git -C "$PACK_DIR" config user.name "pack-repro"
          git -C "$PACK_DIR" config user.email "pack-repro@users.noreply.github.com"
          git -C "$PACK_DIR" status --short
          git -C "$PACK_DIR" commit -m "chore: sync clean pack $PACK_TAG" -m "Source-Commit: $GITHUB_SHA"
          echo "--- leftover after C1 (must be empty) ---"
          git -C "$PACK_DIR" status --short --untracked-files=all | head -50
          test -z "$(git -C "$PACK_DIR" status --short)"
          echo "C1=$(git -C "$PACK_DIR" rev-parse HEAD)"

      # runbook §4.2: C2。cwd は Pack の checkout、source の CLI は絶対 path。
      - name: C2 manifest and commit, local only (runbook §4.2, §4.4)
        run: |
          set -eu
          cd "$PACK_DIR"
          c1="$(git rev-parse HEAD)"
          previous="$(git rev-parse "$PACK_REF^{commit}")"
          node "$SRC_DIR/src/cli.ts" distribution c2-manifest --c1 "$c1" --tag "$PACK_TAG" --previous "$previous" --json
          test "$(git status --short | wc -l | tr -d ' ')" = "1"
          git add -- release/manifest.yaml
          test "$(git diff --cached --name-only)" = "release/manifest.yaml"
          git commit -m "chore: release manifest $PACK_TAG"
          test -z "$(git status --short)"
          # tag は C2 に付ける。local のみ、push しない。
          git tag "$PACK_TAG"
          echo "C2=$(git rev-parse HEAD)"

      # runbook §5: package。cwd は Pack の checkout、source の CLI は絶対 path、出力先は空。
      - name: package (runbook §5)
        run: |
          set -eu
          cd "$PACK_DIR"
          test ! -e "$OUT_DIR"
          node "$SRC_DIR/src/cli.ts" distribution package --tag "$PACK_TAG" --out "$OUT_DIR" --json > "$RUNNER_TEMP/package.json"
          cat "$RUNNER_TEMP/package.json"
          test "$(ls -1 "$OUT_DIR" | wc -l | tr -d ' ')" = "5"
          for ext in tar.gz tar.gz.sha256 ut-tdd.mjs consumer-runtime.json consumer.sha256; do
            test -f "$OUT_DIR/$PACK_TAG.$ext"
          done

      # runbook §6: producer の出力を信用せず、別の道具 (sha256sum) で再計算する。
      - name: verify sha256 independently (runbook §6.1, §6.2)
        run: |
          set -eu
          mkdir -p "$EVIDENCE_DIR"
          : > "$EVIDENCE_DIR/sha256.txt"
          for f in "$OUT_DIR"/*; do
            h="$(sha256sum "$f" | cut -d' ' -f1)"
            printf '%s  %s\n' "$h" "$(basename "$f")" >> "$EVIDENCE_DIR/sha256.txt"
          done
          cat "$EVIDENCE_DIR/sha256.txt"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const mine = Object.fromEntries(fs.readFileSync(process.argv[2], "utf8").trim().split("\n").map((l) => { const [h, n] = l.split(/\s+/); return [n, "sha256:" + h]; }));
            const theirs = pkg.assetDigests;
            const names = Object.keys(mine).sort();
            if (JSON.stringify(names) !== JSON.stringify(Object.keys(theirs).sort())) { console.error("asset set differs"); process.exit(1); }
            for (const n of names) if (mine[n] !== theirs[n]) { console.error("sha256 mismatch: " + n); process.exit(1); }
            const tar = process.argv[4] + ".tar.gz";
            const side = fs.readFileSync(process.argv[3] + "/" + tar + ".sha256", "utf8");
            if (!side.includes(mine[tar].slice(7))) { console.error("tar.gz.sha256 sidecar mismatch"); process.exit(1); }
            console.log("sha256: independent recomputation matches producer output");
          ' "$RUNNER_TEMP/package.json" "$EVIDENCE_DIR/sha256.txt" "$OUT_DIR" "$PACK_TAG"

      - name: write step summary
        run: |
          set -eu
          {
            echo "## pack-repro ($MATRIX_OS)"
            echo
            echo "- OS: \`$MATRIX_OS\` (work root: \`$WORK_ROOT\`)"
            echo "- source SHA: \`$GITHUB_SHA\`"
            echo "- Pack ref: \`$PACK_REF\` / tag (local only): \`$PACK_TAG\`"
            echo "- runner image: ImageOS=\`${ImageOS:-}\` ImageVersion=\`${ImageVersion:-}\` RUNNER_OS=\`$RUNNER_OS\` RUNNER_ARCH=\`$RUNNER_ARCH\`"
            echo "- node: \`$(node -v)\` at \`$(command -v node)\`"
            echo "- npm: \`$(npm -v)\` at \`$(command -v npm)\`"
            echo
            echo "### sha256 (5 assets, sha256sum)"
            echo '```'
            cat "$EVIDENCE_DIR/sha256.txt"
            echo '```'
            echo
            echo "### publicationAudit"
            echo '```json'
            node -e '
              const o = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const a = o.publicationAudit;
              console.log(JSON.stringify(a === undefined ? { publicationAudit: "ABSENT in package --json output" } : { status: a.status, c1: a.c1, c2: a.c2, controlManifestSnapshotDigest: a.controlManifestSnapshotDigest }, null, 2));
              console.log(JSON.stringify({ consumerAnchorDigest: o.consumerAnchorDigest, sourceRevision: o.sourceRevision }, null, 2));
            ' "$RUNNER_TEMP/package.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload assets and sha256.txt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-repro-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ matrix.work_root }}/out/*
            ${{ matrix.work_root }}/evidence/sha256.txt
          if-no-files-found: error
