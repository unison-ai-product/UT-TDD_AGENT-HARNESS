# D0-R Resource Kernel 物理統合 fixture の正本 (PLAN-L5-25 §7 pair-freeze 条件、issue #149)。
#
# PLAN-L5-25 §7 は「L8 で正負 oracle、fixture、観測点、control/workload 別 created count を
# freeze する」を pair-freeze 条件とする。L8 表の fixture 列は識別子と一行説明だけを持つため、
# 「fixture が freeze されている」を第三者が検証できるように、入力構成・配置先・生成規則を本 manifest へ固定する。
#
# status 語彙は 2 値のみ:
#   planned      — 実体は未作成。path は将来の配置先宣言であり、実在してはならない
#                  (実在したら fail-close。宣言だけで実体があるかのように読ませないための不変条件)。
#   materialized — 実体あり。path が実在しなければ fail-close。
#
# 検査は tests/resource-kernel-fixture-manifest.test.ts が実 repo に対して行う。
# 実 runner 証跡は本 manifest の対象外 (PLAN-L5-25 §7.2 (B) が confirmed 昇格条件として保持する)。
