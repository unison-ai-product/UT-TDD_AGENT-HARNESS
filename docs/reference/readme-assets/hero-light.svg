<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="UT-TDD Agent Harness">
<title>UT-TDD Agent Harness</title>
<style>
:root{--fg:#1f2937;--mute:#6b7280;--a1:#2563eb;--a2:#b45309}
text{font-family:system-ui,'Segoe UI',sans-serif;fill:var(--fg)}
.flow{fill:none;stroke:var(--a1);stroke-width:2;stroke-linecap:round;stroke-dasharray:8 14;animation:flow 6s linear infinite}
.flow2{stroke:var(--a2);animation-duration:8s}
.ring{fill:none;stroke:var(--mute);stroke-width:1.5;opacity:.35}
.node{fill:var(--a1);animation:pulse 6s ease-in-out infinite}
.node2{fill:var(--a2);animation-delay:3s}
@keyframes flow{to{stroke-dashoffset:-88}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
<path class="flow" d="M40 90 C260 20 380 160 560 100"/>
<path class="flow flow2" d="M40 230 C240 300 400 150 560 220"/>
<path class="flow" d="M720 100 C900 160 1020 20 1240 90"/>
<path class="flow flow2" d="M720 220 C880 150 1040 300 1240 230"/>
<polygon class="ring" points="640,24 718,69 718,159 640,204 562,159 562,69" transform="translate(640,160) scale(1.5) translate(-640,-114)"/>
<circle class="node" cx="560" cy="100" r="6"/><circle class="node node2" cx="560" cy="220" r="6"/>
<circle class="node node2" cx="720" cy="100" r="6"/><circle class="node" cx="720" cy="220" r="6"/>
<text x="640" y="150" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="2">UT-TDD</text>
<text x="640" y="196" text-anchor="middle" font-size="26" letter-spacing="8" style="fill:var(--mute)">AGENT HARNESS</text>
</svg>
